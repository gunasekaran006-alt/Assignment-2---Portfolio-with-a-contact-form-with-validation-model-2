    <!-- Contact Form Section:- -->

    <section id="contact">

        <form>
            <label for="name">Name:</label><br>
            <!-- <input type="text" name="required"><br><br> -->
            <input type="text" id="name" name="user_name" required><br><br>

            <label for="email">Email:</label><br>
            <!-- <input type="text" name="required"><br><br> -->
            <input type="email" id="email" name="user_email" required><br><br>

            <label for="subject">Subject:</label><br>
            <!-- <input type="text" name="required"><br><br> -->
            <input type="text" id="subject" name="email_subject" required><br><br>

            <label for="message">Message:</label><br>
            <!-- <input type="text" name="required"><br><br> -->
            <textarea id="message" name="user_message" rows="5" required></textarea><br><br>

            <button type="submit">Submit</button><br><br>
        </form>

        <hr>
    </section>
